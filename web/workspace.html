    <script>
        function toggleSidebarGemini() {
            const sidebar = document.getElementById('main-sidebar');
            const iconCollapse = document.getElementById('icon-collapse');
            const iconExpand = document.getElementById('icon-expand');

            const isCurrentlyCollapsed = sidebar.classList.contains('sidebar-collapsed');

            if (isCurrentlyCollapsed) {
                // Buka kembali ke mode normal
                sidebar.classList.remove('sidebar-collapsed');
                sidebar.classList.add('sidebar-expanded');
                iconCollapse.classList.remove('hidden');
                iconExpand.classList.add('hidden');
                localStorage.setItem('gemini_sidebar_state', 'expanded');
            } else {
                // Ciutkan ke mode ikon saja
                sidebar.classList.remove('sidebar-expanded');
                sidebar.classList.add('sidebar-collapsed');
                iconCollapse.classList.add('hidden');
                iconExpand.classList.remove('hidden');
                localStorage.setItem('gemini_sidebar_state', 'collapsed');
            }
        }

        // Pulihkan kondisi terakhir saat halaman dimuat ulang
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('gemini_sidebar_state') === 'collapsed') {
                const sidebar = document.getElementById('main-sidebar');
                const iconCollapse = document.getElementById('icon-collapse');
                const iconExpand = document.getElementById('icon-expand');
                if (sidebar) {
                    sidebar.classList.remove('sidebar-expanded');
                    sidebar.classList.add('sidebar-collapsed');
                    iconCollapse?.classList.add('hidden');
                    iconExpand?.classList.remove('hidden');
                }
            }
        });

        function handleMenuClick(submenuId, btn) {
            const sidebar = document.getElementById('main-sidebar');
            if (sidebar.classList.contains('sidebar-collapsed')) {
                toggleSidebarGemini();
            }
            toggleSubmenu(submenuId, btn);
        }

        // Opsional: Pulihkan posisi terakhir saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('sidebar_closed') === 'true') {
                document.getElementById('main-sidebar')?.classList.add('-ml-48');
            }
        });

        function toggleSubmenu(id, btn) {
            const targetSubmenu = document.getElementById(id);
            const targetArrow = btn ? btn.querySelector('.arrow-icon') : null;
            if (!targetSubmenu) return;

            // Cek apakah menu yang diklik saat ini sedang terbuka
            const isCurrentlyOpen = !targetSubmenu.classList.contains('hidden');

            // 1. TUTUP SEMUA SUBMENU YANG SEDANG TERBUKA
            // Mencari semua kontainer submenu yang berawalan 'sub-'
            const allSubmenus = document.querySelectorAll('[id^="sub-"]');
            allSubmenus.forEach(sub => {
                sub.classList.add('hidden');
            });

            // 2. KEMBALIKAN SEMUA IKON PANAH KE POSISI SEMULA (▶)
            const allArrows = document.querySelectorAll('.arrow-icon');
            allArrows.forEach(arrow => {
                arrow.innerText = '▶';
            });

            // 3. JIKA SEBELUMNYA TERTUTUP, BUKA HANYA MENU YANG DIKLIK INI
            if (!isCurrentlyOpen) {
                targetSubmenu.classList.remove('hidden');
                if (targetArrow) targetArrow.innerText = '▼';
            }
            // Jika sebelumnya memang sudah terbuka, langkah 1 di atas otomatis melipatnya kembali
        }

        // Objek penyimpan status tab yang sedang terbuka
        const openedTabs = {};

        function bukaTabMenu(menuId, title, url) {
            document.getElementById('empty-state')?.classList.add('hidden');

            // 1. CEK APAKAH TAB SUDAH TERBUKA
            // Jika sudah ada, jangan buat baru dan jangan reload, cukup aktifkan tabnya!
            if (openedTabs[menuId]) {
                pindahTab(menuId);
                return;
            }

            // 2. JIKA BELUM ADA, BUAT TAB BARU DI ATAS
            const tabBar = document.getElementById('tab-bar');
            const tabBtn = document.createElement('div');
            tabBtn.id = `tab-btn-${menuId}`;
            tabBtn.className = "flex items-center gap-2 px-3 py-1.5 text-[11px] bg-slate-300 text-slate-700 rounded-t border-t border-x border-slate-300 cursor-pointer transition-all hover:bg-slate-200";
            tabBtn.innerHTML = `
                <span onclick="pindahTab('${menuId}')" class="font-medium whitespace-nowrap">${title}</span>
                <span onclick="tutupTab('${menuId}', event)" class="hover:bg-rose-500 hover:text-white rounded px-1 text-[11px] font-bold text-slate-500 transition-colors" title="Tutup Window">✕</span>
            `;
            tabBar.appendChild(tabBtn);

            // 3. BUAT CONTAINER HALAMAN (IFRAME)
            const container = document.getElementById('workspace-frames');
            const frame = document.createElement('iframe');
            frame.id = `frame-${menuId}`;
            frame.src = url + (url.includes('?') ? '&' : '?') + '_v=' + new Date().getTime();
            frame.className = "w-full h-full border-none hidden";
            frame.onload = function () {
                try {
                    const innerDoc = frame.contentDocument || frame.contentWindow.document;
                    if (innerDoc) {
                        const style = innerDoc.createElement('style');
                        style.innerHTML = `
                            aside, body > nav, body > div > aside, [id="sidebar"] { 
                                display: none !important; 
                                width: 0 !important; 
                                min-width: 0 !important; 
                            }
                            #modal-review {
                                display: flex !important; /* Pastikan modal tidak tersembunyi jika class hidden dicopot */
                            }
                            #modal-review.hidden {
                                display: none !important;
                            }
                            main, body > div:last-child { 
                                width: 100% !important; 
                                flex: 1 1 100% !important; 
                                margin: 0 !important; 
                            }
                        `;
                        innerDoc.head.appendChild(style);
                    }
                } catch (err) {
                    console.log("CORS check pass:", err);
                }
            };
            container.appendChild(frame);

            // Simpan referensi tab
            openedTabs[menuId] = { title, url };

            // Aktifkan tab yang baru dibuat
            pindahTab(menuId);
        }

        function pindahTab(activeId) {
            Object.keys(openedTabs).forEach(id => {
                const btn = document.getElementById(`tab-btn-${id}`);
                const frame = document.getElementById(`frame-${id}`);

                if (!btn || !frame) return;

                if (id === activeId) {
                    // Gaya tab aktif (putih terang dengan border atas biru)
                    btn.className = "flex items-center gap-2 px-3 py-1.5 text-[11px] bg-white text-blue-700 font-bold rounded-t border-t-2 border-t-blue-600 border-x border-slate-300 cursor-pointer shadow-xs";
                    frame.classList.remove('hidden');
                } else {
                    // Gaya tab tidak aktif (abu-abu)
                    btn.className = "flex items-center gap-2 px-3 py-1.5 text-[11px] bg-slate-300 text-slate-600 rounded-t border-t border-x border-slate-400/30 cursor-pointer hover:bg-slate-200/80";
                    frame.classList.add('hidden');
                }
            });
        }

        function tutupTab(menuId, event) {
            if (event) event.stopPropagation();

            const frame = document.getElementById(`frame-${menuId}`);

            // -------------------------------------------------------------
            // CEK DATA DRAF SECARA LANGSUNG DARI DOKUMEN IFRAME
            // -------------------------------------------------------------
            if (frame) {
                try {
                    const innerDoc = frame.contentDocument || frame.contentWindow?.document;

                    if (innerDoc) {
                        let adaDataBelumDisimpan = false;

                        // 1. Cek semua input teks & angka di dalam form/tabel (kecuali tanggal default & cabang)
                        const inputs = innerDoc.querySelectorAll('input, select, textarea');
                        for (let el of inputs) {
                            if (el.type === 'hidden' || el.type === 'date' || el.readOnly || el.disabled) continue;

                            const val = (el.value || '').trim();
                            // Jika ada input teks/keterangan yang terisi
                            if (el.type === 'text' || el.tagName.toLowerCase() === 'textarea') {
                                if (val !== '' && !val.includes('01-') && !val.includes('HO') && val !== '0') {
                                    adaDataBelumDisimpan = true;
                                    break;
                                }
                            }
                            // Jika ada input nominal angka > 0
                            if (el.type === 'number' && parseFloat(val) > 0) {
                                adaDataBelumDisimpan = true;
                                break;
                            }
                        }

                        // 2. Cek baris tabel transaksi jurnal (jika ada lebih dari 1 baris/ada input akun terisi)
                        const rowJurnals = innerDoc.querySelectorAll('#body-jurnal tr, #tabel-jurnal-body tr');
                        if (rowJurnals.length > 0) {
                            for (let tr of rowJurnals) {
                                const selects = tr.querySelectorAll('select');
                                for (let s of selects) {
                                    if (s.value && s.value !== '' && s.value !== '-') {
                                        adaDataBelumDisimpan = true;
                                        break;
                                    }
                                }
                                if (adaDataBelumDisimpan) break;
                            }
                        }

                        // 3. Jika terdeteksi ada data yang diketik/dipilih, MUNCULKAN PERINGATAN
                        if (adaDataBelumDisimpan) {
                            const title = openedTabs[menuId]?.title || 'ini';
                            const konfirmasi = window.confirm(
                                `⚠️ PERINGATAN:\n\n` +
                                `Masih ada data yang sedang diinput pada tab "${title}"!\n` +
                                `Jika tab ditutup sekarang, data yang belum disimpan akan hilang.\n\n` +
                                `Yakin ingin menutup tab ini?`
                            );

                            if (!konfirmasi) {
                                return; // BATALKAN PENUTUPAN TAB
                            }
                        }
                    }
                } catch (err) {
                    console.warn("Pengecekan tab diabaikan:", err);
                }
            }

            // Eksekusi penutupan jika tidak ada data atau user menyetujui konfirmasi
            const tabBtn = document.getElementById(`tab-btn-${menuId}`);
            if (tabBtn) tabBtn.remove();
            if (frame) frame.remove();

            delete openedTabs[menuId];

            const remainingKeys = Object.keys(openedTabs);
            if (remainingKeys.length > 0) {
                pindahTab(remainingKeys[remainingKeys.length - 1]);
            } else {
                document.getElementById('empty-state')?.classList.remove('hidden');
            }
        }

        function toggleSidebarMobile() {
            const sidebar = document.getElementById('main-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar || !backdrop) return;

            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                // Buka drawer di ponsel
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                // Tutup drawer di ponsel
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function bukaTabMenuMobile(menuId, title, url) {
            // Jalankan fungsi asli pembuka tab di workspace
            if (typeof bukaTabMenu === 'function') {
                bukaTabMenu(menuId, title, url);
            }

            // Jika sedang di layar HP (< 768px), tutup drawer sidebar setelah menu dipilih
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('main-sidebar');
                const backdrop = document.getElementById('sidebar-backdrop');
                if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                    backdrop?.classList.add('hidden');
                }
            }
        }



        // PERTAMA KALI DIBUKA: OTOMATIS BUKA DASHBOARD SEBAGAI TAB UTAMA
        document.addEventListener("DOMContentLoaded", () => {
            bukaTabMenu('dashboard', '📊 Dashboard', '/dashboard');
        });

        window.bukaModalGantiPassword = function () {
            const modal = document.getElementById('modal-ganti-password');
            const form = document.getElementById('formGantiPassword');
            if (!modal) {
                alert("⚠️ Modal ganti password tidak ditemukan pada halaman ini.");
                return;
            }
            if (form) form.reset();
            modal.classList.remove('hidden');
        };

        window.tutupModalGantiPassword = function () {
            const modal = document.getElementById('modal-ganti-password');
            if (modal) modal.classList.add('hidden');
        };
    </script>
    <!-- MODAL GANTI PASSWORD MANDIRI -->
    <div id="modal-ganti-password"
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs hidden">
        <div class="bg-white rounded-lg shadow-xl border border-slate-200 w-full max-w-sm overflow-hidden mx-4">
            <div class="bg-slate-800 px-4 py-2.5 flex justify-between items-center text-white">
                <h3 class="font-semibold text-xs flex items-center gap-1.5">🔑 Ganti Password Sendiri</h3>
                <button type="button" onclick="tutupModalGantiPassword()"
                    class="text-slate-400 hover:text-white text-base leading-none">&times;</button>
            </div>
            <form id="formGantiPassword" onsubmit="eksekusiGantiPassword(event)" class="p-4 space-y-2.5">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Password Saat Ini</label>
                    <input type="password" id="pass_lama" required placeholder="••••••••"
                        class="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 text-xs outline-none focus:border-indigo-500 focus:bg-white">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Password Baru</label>
                    <input type="password" id="pass_baru" required placeholder="••••••••"
                        class="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 text-xs outline-none focus:border-indigo-500 focus:bg-white">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Konfirmasi Password
                        Baru</label>
                    <input type="password" id="pass_baru_konfirm" required placeholder="••••••••"
                        class="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 text-xs outline-none focus:border-indigo-500 focus:bg-white">
                </div>
                <div class="pt-2 flex justify-end gap-1.5 border-t border-slate-100">
                    <button type="button" onclick="tutupModalGantiPassword()"
                        class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded text-[11px] font-medium border border-slate-300">Batal</button>
                    <button type="submit" id="btn-simpan-pass"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1 rounded text-[11px] font-bold shadow-xs">Simpan
                        Password</button>
                </div>
            </form>
        </div>
    </div>
