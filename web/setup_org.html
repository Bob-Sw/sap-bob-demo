<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Organisasi - Modul SAP BoB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/role_akses.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="h-full flex overflow-hidden text-slate-700 text-xs">

    <aside
        class="w-48 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800 shadow-xl z-20">
        <div class="h-12 px-3 bg-slate-950/80 flex items-center gap-2 border-b border-slate-800/80">
            <img src="/Logo_SAP.png" alt="Logo" class="h-6 w-auto object-contain"
                onerror="this.onerror=null; this.src='Logo_SAP.png';">
            <h1 class="text-xs font-bold text-white tracking-wide">SAP BoB</h1>
        </div>
        <nav class="flex-1 overflow-y-auto px-2 py-3 space-y-0.5">
            <div class="px-2 pb-1.5 text-[9px] font-semibold text-slate-500 uppercase tracking-wider">Modul Akuntansi
            </div>
            <a href="/dashboard"
                class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all"><span>📊</span>
                Dashboard</a>
            <div id="section-setup-system" class="pt-3 border-t border-slate-800/80 mt-2">
                <div class="px-2 pb-1.5 text-[9px] font-semibold text-amber-500 uppercase tracking-wider">Setup System
                </div>
                <a href="/setup_user"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all"><span>⚙️</span>
                    User & Hak Akses</a>
                <a href="/setup_coa"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all mt-0.5"><span>🗂️</span>
                    Chart of Account</a>
                <a href="/setup_org"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-semibold text-white bg-indigo-600/90 shadow-sm transition-all mt-0.5"><span>🏢</span>
                    Cabang & Dept</a>
                <a href="/setup_voucher"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all mt-0.5"><span>🎟️</span>
                    Kode Voucher</a>
            </div>
        </nav>
        <div class="p-2 bg-slate-950/60 border-t border-slate-800/80">
            <button onclick="localStorage.clear(); window.location.href='/';"
                class="w-full bg-slate-800 hover:bg-rose-600/80 text-slate-300 hover:text-white py-1.5 px-2 rounded text-[10px] font-medium transition-all flex items-center justify-center gap-1.5"><span>🚪</span>
                Logout</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-100/70">
        <header class="h-10 bg-white border-b border-slate-200/80 px-4 flex items-center shadow-xs z-10 flex-shrink-0">
            <div class="flex items-center gap-1.5 text-[11px]">
                <span class="text-slate-400">Setup System</span> <span class="text-slate-300">/</span>
                <h2 class="font-semibold text-slate-800">Data Cabang & Departemen</h2>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

                <div class="flex flex-col gap-3">
                    <div class="bg-white rounded border border-slate-200 shadow-sm p-3 border-t-4 border-t-indigo-500">
                        <div class="flex justify-between items-center mb-2 border-b pb-1">
                            <h3 class="font-bold text-slate-700 text-[11px] uppercase" id="c_title">🏢 Setup Cabang</h3>
                            <button onclick="resetForm('cabang')"
                                class="text-[10px] text-slate-400 hover:text-slate-600 underline">Reset Form</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500">Kode Cabang</label>
                                <input type="text" id="c_kode" placeholder="Misal: HO"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-indigo-500 outline-none uppercase">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500">Nama Cabang</label>
                                <input type="text" id="c_nama" placeholder="Misal: Head Office"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-indigo-500 outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 items-end">
                            <div class="col-span-2">
                                <label class="block text-[10px] font-semibold text-slate-500">Keterangan /
                                    Lokasi</label>
                                <input type="text" id="c_ket" placeholder="Opsional"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-indigo-500 outline-none">
                            </div>
                            <div class="flex gap-1">
                                <button onclick="resetForm('cabang')"
                                    class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 rounded text-[11px] font-medium">Batal</button>
                                <button onclick="simpan('cabang')"
                                    class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1.5 rounded text-[11px] font-semibold shadow-xs">Simpan</button>
                            </div>
                        </div>
                    </div>

                    <div
                        class="bg-white rounded border border-slate-200 shadow-sm flex-1 overflow-hidden flex flex-col min-h-[300px]">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-100 text-slate-600 text-[10px] sticky top-0">
                                <tr>
                                    <th class="py-1.5 px-3 border-b">Kode</th>
                                    <th class="py-1.5 px-3 border-b">Nama Cabang</th>
                                    <th class="py-1.5 px-3 border-b text-center w-20">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-cabang" class="divide-y divide-slate-100 text-[11px]"></tbody>
                        </table>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <div class="bg-white rounded border border-slate-200 shadow-sm p-3 border-t-4 border-t-emerald-500">
                        <div class="flex justify-between items-center mb-2 border-b pb-1">
                            <h3 class="font-bold text-slate-700 text-[11px] uppercase" id="d_title">👥 Setup Departemen
                            </h3>
                            <button onclick="resetForm('departemen')"
                                class="text-[10px] text-slate-400 hover:text-slate-600 underline">Reset Form</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500">Kode Departemen</label>
                                <input type="text" id="d_kode" placeholder="Misal: FIN"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-emerald-500 outline-none uppercase">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500">Nama Departemen</label>
                                <input type="text" id="d_nama" placeholder="Misal: Finance & Acct"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-emerald-500 outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 items-end">
                            <div class="col-span-2">
                                <label class="block text-[10px] font-semibold text-slate-500">Keterangan Fungsi</label>
                                <input type="text" id="d_ket" placeholder="Opsional"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-emerald-500 outline-none">
                            </div>
                            <div class="flex gap-1">
                                <button onclick="resetForm('departemen')"
                                    class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 rounded text-[11px] font-medium">Batal</button>
                                <button onclick="simpan('departemen')"
                                    class="w-2/3 bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1.5 rounded text-[11px] font-semibold shadow-xs">Simpan</button>
                            </div>
                        </div>
                    </div>

                    <div
                        class="bg-white rounded border border-slate-200 shadow-sm flex-1 overflow-hidden flex flex-col min-h-[300px]">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-100 text-slate-600 text-[10px] sticky top-0">
                                <tr>
                                    <th class="py-1.5 px-3 border-b">Kode</th>
                                    <th class="py-1.5 px-3 border-b">Nama Departemen</th>
                                    <th class="py-1.5 px-3 border-b text-center w-20">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-departemen" class="divide-y divide-slate-100 text-[11px]"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        let cacheCabang = [];
        let cacheDepartemen = [];

        document.addEventListener("DOMContentLoaded", () => {
            const role = localStorage.getItem('role') || '';
            if (role !== 'approver' && role !== 'super_user') {
                alert("⛔ AKSES DITOLAK: Menu ini hanya untuk Approver dan Super User.");
                window.location.replace('/dashboard');
                return;
            }
            muatData('cabang');
            muatData('departemen');

            // Khusus Menu 'User & Hak Akses' tetap hanya untuk Super User
            if (role !== 'super_user') {
                const menuUser = document.getElementById('menu-setup-user');
                if (menuUser) menuUser.remove();
            }
        });

        async function muatData(tipe) {
            try {
                const res = await fetch(`/api/${tipe}`);
                const data = await res.json();

                if (tipe === 'cabang') cacheCabang = data;
                else cacheDepartemen = data;

                const tbody = document.getElementById(`tabel-${tipe}`);
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-400 italic">Belum ada data ${tipe}</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const warnaTeks = tipe === 'cabang' ? 'text-indigo-700' : 'text-emerald-700';
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="py-1.5 px-3 font-mono font-bold ${warnaTeks}">${item.kode}</td>
                            <td class="py-1.5 px-3 text-slate-700 font-medium">
                                ${item.nama}
                                <div class="text-[9px] text-slate-400 font-normal mt-0.5">${(item.keterangan && item.keterangan !== '-') ? item.keterangan : ''}</div>
                            </td>
                            <td class="py-1.5 px-3 text-center whitespace-nowrap">
                                <button onclick="edit('${tipe}', '${item.kode}')" class="text-amber-600 hover:bg-amber-100 px-1.5 py-0.5 rounded transition-colors mr-1" title="Edit Data">✏️</button>
                                <button onclick="hapus('${tipe}', '${item.kode}')" class="text-rose-500 hover:bg-rose-100 px-1.5 py-0.5 rounded transition-colors" title="Hapus Data">❌</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(`Error memuat ${tipe}`); }
        }

        // FUNGSI MEMANGGIL DATA KE FORM UNTUK EDIT
        function edit(tipe, kode) {
            const list = tipe === 'cabang' ? cacheCabang : cacheDepartemen;
            const item = list.find(x => x.kode === kode);
            if (!item) return;

            const pfx = tipe === 'cabang' ? 'c_' : 'd_';
            const inputKode = document.getElementById(pfx + 'kode');

            inputKode.value = item.kode;
            inputKode.readOnly = true; // Kunci kode agar tidak terubah
            inputKode.classList.add('bg-slate-200', 'text-slate-500');

            document.getElementById(pfx + 'nama').value = item.nama;
            document.getElementById(pfx + 'ket').value = (item.keterangan === '-') ? '' : (item.keterangan || '');

            const titleElem = document.getElementById(pfx + 'title');
            if (titleElem) {
                titleElem.innerText = tipe === 'cabang' ? `✏️ Edit Cabang: ${item.kode}` : `✏️ Edit Departemen: ${item.kode}`;
            }
        }

        // FUNGSI MENGEMBALIKAN FORM KE STATUS SEMULA
        function resetForm(tipe) {
            const pfx = tipe === 'cabang' ? 'c_' : 'd_';
            const inputKode = document.getElementById(pfx + 'kode');

            inputKode.value = "";
            inputKode.readOnly = false;
            inputKode.classList.remove('bg-slate-200', 'text-slate-500');

            document.getElementById(pfx + 'nama').value = "";
            document.getElementById(pfx + 'ket').value = "";

            const titleElem = document.getElementById(pfx + 'title');
            if (titleElem) {
                titleElem.innerText = tipe === 'cabang' ? '🏢 Setup Cabang' : '👥 Setup Departemen';
            }
        }

        // SIMPAN / UPDATE
        async function simpan(tipe) {
            const pfx = tipe === 'cabang' ? 'c_' : 'd_';
            const payload = {
                kode: document.getElementById(pfx + 'kode').value.trim().toUpperCase(),
                nama: document.getElementById(pfx + 'nama').value.trim(),
                keterangan: document.getElementById(pfx + 'ket').value.trim() || '-'
            };

            if (!payload.kode || !payload.nama) return alert("Kode dan Nama wajib diisi!");

            try {
                const res = await fetch(`/api/${tipe}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (res.ok) {
                    resetForm(tipe);
                    muatData(tipe);
                } else alert("Gagal: " + result.detail);
            } catch (e) { alert("Error jaringan"); }
        }

        // HAPUS DATA
        async function hapus(tipe, kode) {
            if (!confirm(`Yakin ingin menghapus ${tipe.toUpperCase()} dengan kode: ${kode}?`)) return;
            try {
                const res = await fetch(`/api/${tipe}/${kode}`, { method: 'DELETE' });
                if (res.ok) muatData(tipe);
                else alert("Gagal menghapus!");
            } catch (e) { alert("Error jaringan"); }
        }
    </script>
</body>

</html>
