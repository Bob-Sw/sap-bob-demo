<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Kode Voucher - Modul SAP BoB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="h-full flex overflow-hidden text-slate-700 text-xs">

    <aside
        class="w-48 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800 shadow-xl z-20">
        <div class="h-12 px-3 bg-slate-950/80 flex items-center gap-2 border-b border-slate-800/80">
            <img src="/Logo_SAP.png" alt="Logo" class="h-6 w-auto object-contain"
                onerror="this.onerror=null; this.src='Logo_SAP.png';">
            <h1 class="text-xs font-bold text-white tracking-wide">SAP BoB</h1>
        </div>
        <nav class="flex-1 overflow-y-auto px-2 py-3 space-y-0.5">
            <div class="px-2 pb-1.5 text-[9px] font-semibold text-slate-500 uppercase tracking-wider">Modul Akuntansi
            </div>
            <a href="/dashboard"
                class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all"><span>📊</span>
                Dashboard</a>
            <div id="section-setup-system" class="pt-3 border-t border-slate-800/80 mt-2">
                <div class="px-2 pb-1.5 text-[9px] font-semibold text-amber-500 uppercase tracking-wider">Setup System
                </div>
                <a href="/setup_user"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all"><span>⚙️</span>
                    User & Hak Akses</a>
                <a href="/setup_coa"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all mt-0.5"><span>🗂️</span>
                    Chart of Account</a>
                <a href="/setup_org"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all mt-0.5"><span>🏢</span>
                    Cabang & Dept</a>
                <a href="/setup_voucher"
                    class="flex items-center gap-2 px-2 py-1.5 rounded text-[11px] font-semibold text-white bg-indigo-600/90 shadow-sm transition-all mt-0.5"><span>🎟️</span>
                    Kode Voucher</a>
            </div>
        </nav>
        <div class="p-2 bg-slate-950/60 border-t border-slate-800/80">
            <button onclick="localStorage.clear(); window.location.href='/';"
                class="w-full bg-slate-800 hover:bg-rose-600/80 text-slate-300 hover:text-white py-1.5 px-2 rounded text-[10px] font-medium transition-all flex items-center justify-center gap-1.5"><span>🚪</span>
                Logout</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-100/70">
        <header class="h-10 bg-white border-b border-slate-200/80 px-4 flex items-center shadow-xs z-10 flex-shrink-0">
            <div class="flex items-center gap-1.5 text-[11px]">
                <span class="text-slate-400">Setup System</span> <span class="text-slate-300">/</span>
                <h2 class="font-semibold text-slate-800">Master Kode Voucher Jurnal</h2>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 max-w-4xl space-y-3">
            <div class="bg-white rounded border border-slate-200 shadow-sm p-3 border-t-4 border-t-indigo-600">
                <div class="flex justify-between items-center mb-2 border-b pb-1">
                    <h3 class="font-bold text-slate-700 text-[11px] uppercase" id="v_title">🎟️ Input / Edit Kode
                        Voucher</h3>
                    <button onclick="resetForm()"
                        class="text-[10px] text-slate-400 hover:text-slate-600 underline">Reset Form</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-2">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-500">Kode Voucher</label>
                        <input type="text" id="v_kode" placeholder="Misal: JV"
                            class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-indigo-500 outline-none uppercase">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-500">Nama Tipe Voucher</label>
                        <input type="text" id="v_nama" placeholder="Misal: Jurnal Umum"
                            class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-500">Keterangan</label>
                        <input type="text" id="v_ket" placeholder="Misal: Transaksi Umum"
                            class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] focus:bg-white focus:border-indigo-500 outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button onclick="resetForm()"
                        class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded text-[11px] font-medium border border-slate-300">Batal</button>
                    <button onclick="simpanVoucher()"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1 rounded text-[11px] font-semibold shadow-xs">💾
                        Simpan Voucher</button>
                </div>
            </div>

            <div class="bg-white rounded border border-slate-200 shadow-sm overflow-hidden min-h-[300px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-600 text-[10px]">
                        <tr>
                            <th class="py-2 px-3 border-b">Kode</th>
                            <th class="py-2 px-3 border-b">Nama Voucher</th>
                            <th class="py-2 px-3 border-b">Keterangan</th>
                            <th class="py-2 px-3 border-b text-center w-20">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-voucher" class="divide-y divide-slate-100 text-[11px]"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let cacheVoucher = [];

        document.addEventListener("DOMContentLoaded", () => {
            const role = (localStorage.getItem('role') || '').trim().toLowerCase();

            // HANYA APPROVER DAN SUPER_USER YANG BOLEH AKSES
            if (role !== 'approver' && role !== 'super_user') {
                alert("⛔ AKSES DITOLAK: Halaman ini khusus untuk Approver & Super User.");
                window.location.replace('/dashboard');
                return;
            }

            // Sembunyikan menu Setup User jika bukan Super User
            if (role !== 'super_user') {
                const menuUser = document.getElementById('menu-setup-user');
                if (menuUser) menuUser.remove();
            }

            muatVoucher();
        });

        async function muatVoucher() {
            try {
                const res = await fetch('/api/voucher');
                const data = await res.json();
                cacheVoucher = data;
                const tbody = document.getElementById('tabel-voucher');
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-400 italic">Belum ada kode voucher.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="py-1.5 px-3 font-mono font-bold text-indigo-700">${item.kode}</td>
                            <td class="py-1.5 px-3 font-semibold text-slate-800">${item.nama}</td>
                            <td class="py-1.5 px-3 text-slate-500">${item.keterangan || '-'}</td>
                            <td class="py-1.5 px-3 text-center whitespace-nowrap">
                                <button onclick="editVoucher('${item.kode}')" class="text-amber-600 hover:bg-amber-100 px-1.5 py-0.5 rounded transition-colors mr-1">✏️</button>
                                <button onclick="hapusVoucher('${item.kode}')" class="text-rose-500 hover:bg-rose-100 px-1.5 py-0.5 rounded transition-colors">❌</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error("Error muat voucher"); }
        }

        function editVoucher(kode) {
            const item = cacheVoucher.find(x => x.kode === kode);
            if (!item) return;

            const kInput = document.getElementById('v_kode');
            kInput.value = item.kode;
            kInput.readOnly = true;
            kInput.classList.add('bg-slate-200', 'text-slate-500');

            document.getElementById('v_nama').value = item.nama;
            document.getElementById('v_ket').value = (item.keterangan === '-') ? '' : item.keterangan;
            document.getElementById('v_title').innerText = `✏️ Edit Voucher: ${item.kode}`;
        }

        function resetForm() {
            const kInput = document.getElementById('v_kode');
            kInput.value = "";
            kInput.readOnly = false;
            kInput.classList.remove('bg-slate-200', 'text-slate-500');

            document.getElementById('v_nama').value = "";
            document.getElementById('v_ket').value = "";
            document.getElementById('v_title').innerText = "🎟️ Input / Edit Kode Voucher";
        }

        async function simpanVoucher() {
            const payload = {
                kode: document.getElementById('v_kode').value.trim().toUpperCase(),
                nama: document.getElementById('v_nama').value.trim(),
                keterangan: document.getElementById('v_ket').value.trim() || '-'
            };

            if (!payload.kode || !payload.nama) return alert("Kode dan Nama Voucher wajib diisi!");

            try {
                const res = await fetch('/api/voucher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    resetForm();
                    muatVoucher();
                } else {
                    const result = await res.json();
                    alert("Gagal: " + result.detail);
                }
            } catch (e) { alert("Error jaringan"); }
        }

        async function hapusVoucher(kode) {
            if (!confirm(`Hapus kode voucher ${kode}?`)) return;
            try {
                const res = await fetch(`/api/voucher/${kode}`, { method: 'DELETE' });
                if (res.ok) muatVoucher();
                else alert("Gagal menghapus!");
            } catch (e) { alert("Error jaringan"); }
        }
    </script>
</body>

</html>
