<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Modul SAP BoB</title>
    <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Animasi Logo Melayang (Berjalan naik turun) */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Efek Transisi Hilang untuk Intro */
        .fade-out {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-out, visibility 1s ease-out;
        }

        /* Glassmorphism untuk Card Login */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="h-full flex items-center justify-center overflow-hidden relative text-slate-200">

    <!-- 1. INTRO SPLASH SCREEN -->
    <div id="intro-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950">
        <img src="/web/Logo_SAP.png" alt="Logo SAP" class="h-80 w-auto object-contain animate-float mb-8"
            onerror="this.style.display='none'">
        <h1 class="text-2xl md:text-2xl font-extrabold text-white tracking-widest uppercase text-center px-4">
            Bahana Optima Berteknologi
        </h1>
        <p class="text-indigo-400 mt-4 text-xs tracking-wider animate-pulse uppercase font-semibold">Memuat Sistem ...
        </p>
    </div>

    <!-- 2. HALAMAN LOGIN UTAMA -->
    <div class="w-full max-w-md p-8 glass-card rounded-2xl shadow-2xl relative z-10 transform scale-95 opacity-0 transition-all duration-1000"
        id="login-container">
        <div class="text-center mb-8">
            <img src="/web/Logo_SAP.png" alt="Logo SAP" class="h-12 w-auto mx-auto mb-4"
                onerror="this.style.display='none'">
            <h2 class="text-2xl font-bold text-white tracking-wide">Modul SAP BoB</h2>
            <p class="text-xs text-slate-400 mt-1">Sistem Akuntansi & Pelaporan</p>
            <p class="text-xs text-slate-400 mt-1">Ver. 2.5</p>
        </div>

        <form id="formLogin" onsubmit="prosesLogin(event)" class="space-y-5">
            <div>
                <label
                    class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wide">Username</label>
                <div class="relative">
                    <input type="text" id="username" required
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                        placeholder="Masukkan username">
                </div>
            </div>

            <div>
                <label
                    class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wide">Password</label>
                <div class="relative">
                    <input type="password" id="password" required
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <div id="pesan-error"
                class="hidden bg-rose-500/10 border border-rose-500/50 text-rose-400 text-xs font-semibold p-3 rounded-lg text-center">
                Username atau password salah!
            </div>

            <button type="submit" id="btn-login"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg text-sm transition-all shadow-lg shadow-indigo-600/30 flex justify-center items-center gap-2">
                Masuk ke Sistem 🚀
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-800 pt-4">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">&copy; 2026 PT. Bahana Optima Berteknologi
            </p>
        </div>
    </div>

    <!-- ORNAMENT BACKGROUND (Opsional untuk estetika) -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl -z-10"></div>

    <script>
        // 1. LOGIKA INTRO SPLASH SCREEN
        document.addEventListener("DOMContentLoaded", () => {
            // Bersihkan sesi lama agar pengguna selalu melihat Intro & Form Login
            localStorage.clear();

            const intro = document.getElementById('intro-screen');
            const loginContainer = document.getElementById('login-container');

            // Jalankan Intro selama 3 detik, lalu tampilkan form login
            setTimeout(() => {
                // Sembunyikan Intro (efek fade-out)
                intro.classList.add('fade-out');

                // Munculkan Form Login secara halus
                setTimeout(() => {
                    intro.style.display = 'none';
                    loginContainer.classList.remove('scale-95', 'opacity-0');
                    loginContainer.classList.add('scale-100', 'opacity-100');
                }, 1000); // Waktu tunggu transisi fade-out selesai
            }, 3000); // Durasi intro tampil (3 detik)
        });

        // 2. LOGIKA PROSES LOGIN KE BACKEND
        async function prosesLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errBox = document.getElementById('pesan-error');

            btn.innerHTML = 'Memverifikasi... ⏳';
            btn.disabled = true;
            errBox.classList.add('hidden');

            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    btn.innerHTML = 'Berhasil! Mengalihkan... ✅';
                    btn.classList.replace('bg-indigo-600', 'bg-emerald-600');

                    // Simpan sesi login ke LocalStorage
                    localStorage.setItem('role', result.role);
                    localStorage.setItem('username', result.username);
                    localStorage.setItem('nama_karyawan', result.nama_karyawan || result.username);

                    // Alihkan langsung ke Workspace
                    setTimeout(() => {
                        window.location.href = "/workspace";
                    }, 800);

                } else {
                    throw new Error(result.detail || "Username atau password salah.");
                }
            } catch (error) {
                errBox.innerText = error.message;
                errBox.classList.remove('hidden');
                btn.innerHTML = 'Masuk ke Sistem 🚀';
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
