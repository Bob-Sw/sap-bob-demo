<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Neraca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 15mm;
            }

            .no-print,
            header,
            aside,
            .filter-box,
            button {
                display: none !important;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .sheet-box {
                border: none !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 p-4 md:p-8 font-sans">

    <!-- Filter Control (No Print) -->
    <div
        class="no-print bg-white border border-slate-300 rounded p-4 mb-6 shadow-sm max-w-3xl mx-auto flex flex-wrap justify-between items-center gap-3">
        <h1 class="text-sm font-bold text-slate-800">⚖️ Balance Sheet</h1>
        <div class="flex items-center gap-2">
            <div>
                <label class="text-[10px] font-semibold text-slate-500 block">Per Tanggal</label>
                <input type="date" id="per_tanggal"
                    class="border border-slate-300 rounded px-2 py-1 text-xs outline-none">
            </div>
            <div>
                <label class="block text-[11px] mb-1 font-semibold text-slate-600">Cabang</label>
                <select id="kode_cabang" onchange="loadBalanceSheet()" class="border border-slate-300 rounded px-2 py-1 text-sm bg-white outline-none">
                    <option value="SEMUA" selected>Semua Cabang</option>
                </select>
            </div>
            <div class="pt-3.5 flex gap-2">
                <button onclick="loadBalanceSheet()"
                    class="bg-blue-700 hover:bg-blue-800 text-white font-semibold text-xs px-3 py-1.5 rounded transition">Tampilkan</button>
                <button onclick="window.print()"
                    class="bg-slate-700 hover:bg-slate-800 text-white font-semibold text-xs px-3 py-1.5 rounded transition">Cetak</button>
            </div>
        </div>
    </div>

    <!-- Lembar Neraca Sesuai Format Tampilan Web -->
    <div
        class="sheet-box bg-white border border-slate-300 rounded shadow-sm max-w-3xl mx-auto pt-5 pb-8 md:px-10 text-[13px]">

        <!-- KOP RESMI LAPORAN (LOGO + NAMA USAHA + JUDUL + PERIODE) -->
        <div class="border-b-2 border-black pb-5 mb-4 grid grid-cols-12 items-start gap-2">
            <div class="col-span-4 flex items-start gap-2.5 relative -top-0">
                <img id="kop_logo" src="" alt="Logo" class="h-8 w-auto max-w-[90px] object-contain hidden"
                    onerror="this.classList.add('hidden')">
                <h1 id="kop_nama_usaha"
                    class="text-[11px] font-bold uppercase tracking-wide text-blue-800 leading-tight pt-0.5  whitespace-nowrap">
                    <!-- Terisi otomatis dari Java Script -->
                </h1>
            </div>

            <!-- TENGAH: Judul Laporan & Sub Judul Cabang Dinamis -->
            <div class="col-span-4 text-center translate-y-[16px]">
                <h2 class="text-sm font-black uppercase tracking-wider text-black">
                    NERACA
                </h2>
                <p id="subJudulCabang" class="text-[11px] font-semibold text-slate-600 mt-0.5">
                    Semua Cabang
                </p>
            </div>

            <!-- Kanan: Tanggal & Keterangan -->
            <div class="col-span-4 text-right text-xs translate-y-[16px]">
                <p id="lblTanggal" class="font-bold text-slate-800 font-mono">Per Tanggal: -</p>
                <p class="text-[10px] text-slate-400 italic">Mata Uang: IDR (Rupiah)</p>
            </div>
        </div>

        <!-- I. AKTIVA -->
        <div>
            <div class="font-bold text-sm tracking-wide text-black mb-1.5">I &nbsp;&nbsp;&nbsp; AKTIVA</div>

            <!-- 1. Aktiva Lancar -->
            <div class="ml-4 mb-3">
                <div class="font-bold text-black mb-1">1 &nbsp;&nbsp; Aktiva Lancar</div>
                <div id="list_aktiva_lancar" class="ml-6 space-y-1"></div>
            </div>

            <!-- 2. Aktiva Tetap -->
            <div class="ml-4 mb-3">
                <div class="font-bold text-black mb-1">2 &nbsp;&nbsp; Aktiva Tetap</div>
                <div id="list_aktiva_tetap" class="ml-6 space-y-1"></div>
            </div>

            <!-- 3. Aktiva Tidak Berwujud -->
            <div class="ml-4 mb-3">
                <div class="font-bold text-black mb-1">3 &nbsp;&nbsp; Aktiva Tidak Berwujud</div>
                <div id="list_aktiva_tak_berwujud" class="ml-6 space-y-1"></div>
            </div>

            <!-- TOTAL AKTIVA -->
            <div class="border-t border-b border-black font-bold py-2 mt-4 flex justify-between items-center text-sm">
                <span class="tracking-wide">TOTAL AKTIVA</span>
                <span id="total_aktiva" class="font-mono text-base">Rp 0</span>
            </div>
        </div>

        <!-- II. PASIVA -->
        <div class="pt-2">
            <div class="font-bold text-sm tracking-wide text-black mb-1.5">II &nbsp;&nbsp; PASIVA</div>

            <!-- 1. Passiva Lancar -->
            <div class="ml-4 mb-3">
                <div class="font-bold text-black mb-1">1 &nbsp;&nbsp; Passiva Lancar</div>
                <div id="list_passiva_lancar" class="ml-6 space-y-1"></div>
            </div>

            <!-- 2. Pinjaman -->
            <div class="ml-4 mb-3">
                <div class="font-bold text-black mb-1">2 &nbsp;&nbsp; Pinjaman</div>
                <div id="list_pinjaman" class="ml-6 space-y-1"></div>
            </div>

            <!-- 3. Modal -->
            <div class="ml-4 mb-3">
                <div class="font-bold text-black mb-1">3 &nbsp;&nbsp; Modal</div>
                <div id="list_modal" class="ml-6 space-y-1"></div>
            </div>

            <!-- TOTAL PASIVA -->
            <div
                class="border-t-2 border-b-[3px] border-black font-bold py-2 mt-4 flex justify-between items-center text-sm">
                <span class="tracking-wide">TOTAL PASIVA</span>
                <span id="total_pasiva" class="font-mono text-base">Rp 0</span>
            </div>
        </div>

    </div>
    </div>

    <script>
        document.getElementById('per_tanggal').value = new Date().toISOString().slice(0, 10);

        const formatRp = (val) => {
            if (!val && val !== 0) return "Rp 0";
            const isNeg = val < 0;
            const res = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(Math.abs(val));
            return isNeg ? `-${res}` : res;
        };

        const renderItems = (containerId, items) => {
            const el = document.getElementById(containerId);
            if (!items || items.length === 0) {
                el.innerHTML = `<div class="text-slate-400 italic text-[11px]">- Tidak ada saldo -</div>`;
                return;
            }
            el.innerHTML = items.map((item, idx) => `
                <div class="flex justify-between py-0.5 hover:bg-slate-50">
                    <span>${idx + 1} &nbsp;&nbsp; ${item.nama}</span>
                    <span class="font-mono ${item.saldo < 0 ? 'text-rose-600' : ''}">${formatRp(item.saldo)}</span>
                </div>
            `).join('');
        };

        async function muatMasterCabang() {
            try {
                const res = await fetch('/api/cabang');
                if (res.ok) {
                    const listCabang = await res.json();
                    const selCabang = document.getElementById('kode_cabang');
                    if (selCabang && listCabang.length > 0) {
                        selCabang.innerHTML = '<option value="SEMUA" selected>Semua Cabang</option>';
                        listCabang.forEach(c => {
                            selCabang.innerHTML += `<option value="${c.kode}">${c.kode} - ${c.nama}</option>`;
                        });
                    }
                }
            } catch (e) {
                console.warn("Gagal memuat cabang:", e);
            }
        }

        // 2. Load data Neraca
        async function loadBalanceSheet() {
            const elTgl = document.getElementById('per_tanggal');
            const elCbg = document.getElementById('kode_cabang');

            const tgl = elTgl ? elTgl.value : '';
            const cbg = elCbg ? elCbg.value : 'SEMUA';
            const cbgNama = elCbg && elCbg.selectedIndex >= 0 ? elCbg.options[elCbg.selectedIndex].text : 'Semua Cabang';

            // Update Label Tanggal & Cabang di Kop Laporan
            const lblTgl = document.getElementById('lblTanggal') || document.getElementById('subJudulTanggal');
            if (lblTgl) lblTgl.innerText = `Per Tanggal: ${tgl || '-'}`;

            const lblCbg = document.getElementById('subJudulCabang');
            if (lblCbg) lblCbg.innerText = cbgNama;

            try {
                const res = await fetch(`/api/balance_sheet?per_tanggal=${encodeURIComponent(tgl)}&kode_cabang=${encodeURIComponent(cbg)}&_t=${Date.now()}`);
                if (!res.ok) return;
                const data = await res.json();

                // Render kelompok Aktiva & Pasiva
                if (typeof renderItems === 'function') {
                    if (data.aktiva) {
                        renderItems('list_aktiva_lancar', data.aktiva.lancar || []);
                        renderItems('list_aktiva_tetap', data.aktiva.tetap || []);
                        renderItems('list_aktiva_tak_berwujud', data.aktiva.tak_berwujud || []);
                        const totAkt = document.getElementById('total_aktiva');
                        if (totAkt) totAkt.innerText = formatRp(data.aktiva.total || 0);
                    }
                    if (data.pasiva) {
                        renderItems('list_passiva_lancar', data.pasiva.lancar || []);
                        renderItems('list_pinjaman', data.pasiva.pinjaman || []);
                        renderItems('list_modal', data.pasiva.modal || []);
                        const totPas = document.getElementById('total_pasiva');
                        if (totPas) totPas.innerText = formatRp(data.pasiva.total || 0);
                    }
                }

                // Tampilan Eksekutif / Ringkasan (jika elemen tersedia)
                if (document.getElementById('totAsetLancar')) document.getElementById('totAsetLancar').innerText = formatRp(data.aset?.tot_aset_lancar || 0);
                if (document.getElementById('totAsetTetap')) document.getElementById('totAsetTetap').innerText = formatRp(data.aset?.tot_aset_tetap || 0);
                if (document.getElementById('grandTotalAset')) document.getElementById('grandTotalAset').innerText = formatRp(data.aset?.total_aset || 0);

                if (document.getElementById('totKewajibanPendek')) document.getElementById('totKewajibanPendek').innerText = formatRp(data.pasiva?.tot_kewajiban_pendek || 0);
                if (document.getElementById('totKewajibanPanjang')) document.getElementById('totKewajibanPanjang').innerText = formatRp(data.pasiva?.tot_kewajiban_panjang || 0);
                if (document.getElementById('totEkuitas')) document.getElementById('totEkuitas').innerText = formatRp(data.pasiva?.total_ekuitas || 0);
                if (document.getElementById('grandTotalPasiva')) document.getElementById('grandTotalPasiva').innerText = formatRp(data.pasiva?.total_pasiva || 0);

                // Badge Keseimbangan
                const badge = document.getElementById('badgeBalance');
                if (badge) {
                    badge.classList.remove('hidden');
                    if (data.is_balanced) {
                        badge.innerHTML = `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded">✅ NERACA SEIMBANG</span>`;
                    } else {
                        const selisih = Math.abs((data.aset?.total_aset || 0) - (data.pasiva?.total_pasiva || 0));
                        badge.innerHTML = `<span class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded">⚠️ TIDAK SEIMBANG (Selisih: ${formatRp(selisih)})</span>`;
                    }
                }
            } catch (err) {
                console.error("Gagal memuat neraca:", err);
            }
        }

        // Inisialisasi awal saat halaman dibuka
        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof muatKopPerusahaan === 'function') muatKopPerusahaan();
            await muatMasterCabang();
            await loadBalanceSheet();
        });

        // Letakkan muatKopPerusahaan secara terpisah dan tangani error-nya tanpa alert
        async function muatKopPerusahaan() {
            try {
                const res = await fetch('/api/profil_usaha');
                if (!res.ok) return;
                const data = await res.json();

                const elNama = document.getElementById('kop_nama_usaha');
                if (elNama && data.nama_usaha) {
                    elNama.innerText = data.nama_usaha;
                }

                const elLogo = document.getElementById('kop_logo');
                if (elLogo && data.logo_path) {
                    let cleanUrl = data.logo_path.replace(/^\/web\//, '/');
                    elLogo.src = cleanUrl + '?t=' + Date.now();
                    elLogo.onload = () => elLogo.classList.remove('hidden');
                }
            } catch (e) {
                // Jangan beri alert di sini agar tidak mengganggu laporan
                console.warn("Info profil usaha belum dimuat:", e);
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            muatKopPerusahaan(); // <-- Wajib dipanggil di sini
        });
        document.addEventListener('DOMContentLoaded', loadBalanceSheet);
    </script>
</body>

</html>
